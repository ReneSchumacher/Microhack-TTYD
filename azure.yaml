# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ttyd-tf

services:
  web:
    project: src
    language: js
    host: appservice
    resourceGroup: ${RESOURCE_GROUP_NAME}
    resourceName: ${AZURE_APP_SERVICE_WEB_APP_NAME}

infra:
  provider: bicep
  path: infra
  module: main

# NOTE (Phase 1): the preprovision/postprovision hooks that performed permission
# checks and data loading were removed for the infra-only Bicep checkpoint. That
# orchestration (Entra users, SQL MI Directory-Readers grant + AD admin, Fabric
# gateway/workspaces/role-assignments, .bak restore, jobs, product, stored proc)
# is rebuilt in Phase 2 as the MicroHack labautomation shared/per-lab scripts.
